spring.application.name=FarmVerse
server.port=8085


spring.datasource.url=jdbc:mysql://bnwoibw6wf8mqzipy8kt-mysql.services.clever-cloud.com:3306/bnwoibw6wf8mqzipy8kt?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# FarmVerse AI (Groq - OpenAI-compatible free API)
groq.api.key=${GROQ_API_KEY:}
groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.model=llama-3.3-70b-versatile

# Real-time weather (OpenWeatherMap)
weatherapi.api.key=${WEATHERAPI_API_KEY:}
weatherapi.forecast.url=https://api.weatherapi.com/v1/forecast.json